build:
  command: ""
  system: docker
  min_cpu: 0.1
  max_cpu: 2
  min_memory: 256
  max_memory: 10240
scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.25
  min_memory: 256
  max_memory: 512
  min_replicas: 1
  max_replicas: 1
health_check:
  type: tcp
  interval_in_seconds: 10
cron_jobs: []
workers: []
review_apps:
  enabled: false
  inherit_worker_processes: true
  inherit_cron_jobs: true
  ttl_days: 1
